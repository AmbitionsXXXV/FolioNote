name: Supabase Keepalive

# Supabase pauses Free Plan projects with too few database queries over 7 days.
# /ready runs a real SQL query and returns 503 when the database is unreachable,
# so a failed run here also means the project may already be paused.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Query database through /ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request /ready
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 https://api.folionote.xyz/ready
