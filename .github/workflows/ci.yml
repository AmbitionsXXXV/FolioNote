name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/server/**"
      - "apps/native/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/native/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
        env:
          # HeroUI Pro is licensed; its postinstall uses this token to fetch Pro
          # artifacts (e.g. @heroui-pro/react/css) that `vp check` resolves.
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Lint & format
        run: vp check

      - name: Type check
        run: vp run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folionote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folionote_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folionote_test
      # CI-only dummy (>=32 chars) so server env validation / auth init don't fail.
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
        env:
          # HeroUI Pro is licensed; its postinstall uses this token to fetch Pro
          # artifacts (e.g. @heroui-pro/react/css) that `vp check` resolves.
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Push database schema
        run: vp run db:push
        continue-on-error: true

      - name: Run server tests
        run: vp test --project server

  build:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
        env:
          # HeroUI Pro is licensed; its postinstall uses this token to fetch Pro
          # artifacts (e.g. @heroui-pro/react/css) that `vp check` resolves.
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Build server
        run: vp run build -F server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-dist
          path: apps/server/dist
          retention-days: 7
