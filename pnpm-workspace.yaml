---
packages:
  - apps/*
  - packages/*

overrides:
  drizzle-orm: ^0.45.4
  # 1.47.0's package "exports" map routes `es-toolkit/compat/*` subpaths (pulled in
  # by recharts) to CJS even for ESM importers; Rolldown's dep optimizer then
  # mis-names the generated module factories and crashes at runtime with
  # "require_isPlainObject is not a function". 1.47.1 fixes the exports map to serve
  # real ESM (.mjs) for those subpaths.
  es-toolkit: ^1.47.1
  vite@*: "catalog:"
  vitest@*: 5.0.5

# @heroui-pro/react's registry stub declares no peers (its postinstall swaps in
# the licensed build), so pnpm resolved React for it from the hoisted copy —
# native's react@19.3.0 — while web renders with 19.3.1: two Reacts, and every
# Pro hook crashed with "Cannot read properties of null (reading 'useMemo')".
# Declaring the context-bearing peers links Pro to the consumer's copies.
packageExtensions:
  "@heroui-pro/react":
    peerDependencies:
      "@heroui/react": ">=3.2.0"
      "@heroui/styles": ">=3.2.0"
      react: ">=19.0.0"
      react-aria-components: ">=1.18.0"
      react-dom: ">=19.0.0"

allowBuilds:
  "@heroui-pro/react": true
  "@prisma/engines": true
  "@shopify/react-native-skia": true
  "@zowe/secrets-for-zowe-sdk": true
  esbuild: true
  heroui-native-pro: true
  heroui-pro: true
  msgpackr-extract: false
  msw: true
  prisma: true
  sharp: true
  supabase: true
