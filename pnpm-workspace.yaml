  "@prisma/engines": true
  "@shopify/react-native-skia": true
  "@zowe/secrets-for-zowe-sdk": true
  esbuild: true
  heroui-native-pro: true
  heroui-pro: true
  msgpackr-extract: false
  msw: true
  prisma: true
  sharp: true
  supabase: true
