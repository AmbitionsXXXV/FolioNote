---
packages:
  - apps/*
  - packages/*

overrides:
  drizzle-orm: ^0.45.2
  # 1.47.0's package "exports" map routes `es-toolkit/compat/*` subpaths (pulled in
  # by recharts) to CJS even for ESM importers; Rolldown's dep optimizer then
  # mis-names the generated module factories and crashes at runtime with
  # "require_isPlainObject is not a function". 1.47.1 fixes the exports map to serve
  # real ESM (.mjs) for those subpaths.
  es-toolkit: ^1.47.1
  vite@*: "catalog:"
  vitest@*: 5.0.1

allowBuilds:
